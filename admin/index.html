<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#1e2c26" />
  <title>弦间 · 运营管理后台</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./css/admin.css" />
  <!-- ECharts 默认使用 CDN，加载失败时 app.js 会自动回退到本地 vendor 文件。 -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <div class="app-shell">
    <div class="sidebar-backdrop" data-sidebar-close hidden></div>
    <aside class="sidebar" id="sidebar" aria-label="主导航">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 44 44" fill="none">
            <path d="M22 5C13 12 8 20 8 27a14 14 0 0 0 28 0c0-7-5-15-14-22Z" fill="currentColor" opacity=".18"/>
            <path d="M22 8c-7.5 6.2-11.7 13-11.7 19A11.7 11.7 0 0 0 22 38.7 11.7 11.7 0 0 0 33.7 27c0-6-4.2-12.8-11.7-19Z" stroke="currentColor" stroke-width="1.6"/>
            <path d="M18 17v12M18 17l9-2v10M18 29a3.2 3.2 0 1 1-3.2-3.2A3.2 3.2 0 0 1 18 29Zm9-5a3.2 3.2 0 1 1-3.2-3.2A3.2 3.2 0 0 1 27 24Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="brand-copy">
          <strong>弦间</strong>
          <span>XIAN JIAN STUDIO</span>
        </div>
      </div>

      <div class="sidebar-section-label">内容运营</div>
      <nav class="nav-list">
        <a class="nav-item" href="#/scores" data-nav="scores">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 3.8h10A2.2 2.2 0 0 1 19.2 6v12a2.2 2.2 0 0 1-2.2 2.2H7A2.2 2.2 0 0 1 4.8 18V6A2.2 2.2 0 0 1 7 3.8Z" stroke="currentColor" stroke-width="1.7"/><path d="M8.6 8.5h6.8M8.6 12h6.8M8.6 15.5h4.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          <span>吉他谱管理</span>
        </a>
        <a class="nav-item" href="#/videos" data-nav="videos">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.8" y="5.2" width="16.4" height="13.6" rx="3" stroke="currentColor" stroke-width="1.7"/><path d="m10.2 9.3 4.8 2.7-4.8 2.7V9.3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
          <span>视频管理</span>
        </a>
      </nav>

      <div class="sidebar-section-label">数据中心</div>
      <nav class="nav-list">
        <a class="nav-item" href="#/analytics" data-nav="analytics">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4.5 19.5V13M9.5 19.5V7.8M14.5 19.5v-4.2M19.5 19.5V4.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M3 19.5h18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" opacity=".5"/></svg>
          <span>数据分析</span>
        </a>
        <a class="nav-item" href="#/users" data-nav="users">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="8.2" r="3.5" stroke="currentColor" stroke-width="1.7"/><path d="M5.2 19.6c.5-3.5 3-5.5 6.8-5.5s6.3 2 6.8 5.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          <span>用户管理</span>
        </a>
      </nav>

      <div class="sidebar-note">
        <span class="live-dot"></span>
        <div>
          <strong>自建行为分析</strong>
          <p>事件由小程序 SDK 直传本服务</p>
        </div>
      </div>
      <div class="sidebar-footer">
        <span>弦间运营台</span>
        <span class="version">v1.0</span>
      </div>
    </aside>

    <div class="main-shell">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-button mobile-menu" id="menu-toggle" type="button" aria-label="打开导航">
            <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
          <div>
            <p class="eyebrow" id="page-eyebrow">CONTENT OPERATIONS</p>
            <h1 id="page-title">数据分析</h1>
            <p class="page-subtitle" id="page-subtitle">用真实行为数据理解听众与内容。</p>
          </div>
        </div>
        <div class="topbar-right">
          <span class="topbar-date" id="topbar-date"></span>
          <div class="admin-chip" title="当前管理员">
            <span class="admin-avatar" id="admin-avatar">A</span>
            <span class="admin-name" id="admin-name">管理员</span>
          </div>
          <button class="text-button logout-button" id="logout-button" type="button">退出</button>
        </div>
      </header>

      <main class="page-content" id="page-content" tabindex="-1">
        <div class="page-loading" aria-label="正在加载">
          <div class="skeleton skeleton-title"></div>
          <div class="summary-grid">
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
          </div>
          <div class="chart-grid">
            <div class="skeleton skeleton-chart"></div>
            <div class="skeleton skeleton-chart"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <dialog class="app-dialog" id="app-dialog"></dialog>
  <dialog class="confirm-dialog" id="confirm-dialog"></dialog>
  <div class="toast-stack" id="toast-stack" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
