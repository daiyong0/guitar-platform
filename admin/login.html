<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#1e2c26" />
  <title>登录 · 弦间运营管理后台</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./css/admin.css" />
  <script type="module" src="./js/login.js"></script>
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-art" aria-label="弦间品牌介绍">
      <div class="login-art-glow"></div>
      <div class="login-brand">
        <div class="brand-mark large" aria-hidden="true">
          <svg viewBox="0 0 44 44" fill="none">
            <path d="M22 5C13 12 8 20 8 27a14 14 0 0 0 28 0c0-7-5-15-14-22Z" fill="currentColor" opacity=".18"/>
            <path d="M22 8c-7.5 6.2-11.7 13-11.7 19A11.7 11.7 0 0 0 22 38.7 11.7 11.7 0 0 0 33.7 27c0-6-4.2-12.8-11.7-19Z" stroke="currentColor" stroke-width="1.6"/>
            <path d="M18 17v12M18 17l9-2v10M18 29a3.2 3.2 0 1 1-3.2-3.2A3.2 3.2 0 0 1 18 29Zm9-5a3.2 3.2 0 1 1-3.2-3.2A3.2 3.2 0 0 1 27 24Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div>
          <strong>弦间</strong>
          <span>XIAN JIAN</span>
        </div>
      </div>

      <div class="login-art-copy">
        <p class="login-kicker">GUITAR TAB · LIVE REPLAY</p>
        <h1>让每一次拨弦，<br />都有迹可循。</h1>
        <p class="login-description">吉他谱与直播回放内容管理、用户路径回放、自建行为分析，一个后台完成内容运营的全部闭环。</p>
      </div>

      <div class="fret-art" aria-hidden="true">
        <span class="fret-string s1"></span>
        <span class="fret-string s2"></span>
        <span class="fret-string s3"></span>
        <span class="fret-string s4"></span>
        <span class="fret-string s5"></span>
        <span class="fret-string s6"></span>
        <span class="fret-num n1">3</span>
        <span class="fret-num n2">5</span>
        <span class="fret-num n3">7</span>
      </div>

      <div class="login-art-footer">
        <span class="live-dot"></span>
        <span>练习不止，记录不息</span>
        <span class="login-art-version">STUDIO CONSOLE / 01</span>
      </div>
    </section>

    <section class="login-panel">
      <div class="login-form-wrap">
        <div class="login-form-heading">
          <span class="login-mobile-brand">
            <span class="brand-mini-mark">弦</span>
            弦间运营台
          </span>
          <p class="eyebrow">OPERATOR ACCESS</p>
          <h2>欢迎回来</h2>
          <p>登录后管理内容、查看听众行为与转化路径。</p>
        </div>

        <form id="login-form" class="login-form" novalidate>
          <div class="field">
            <label class="field-label" for="username">管理员账号</label>
            <div class="input-with-icon">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="8.2" r="3.4" stroke="currentColor" stroke-width="1.7"/><path d="M5.4 19.4c.5-3.4 2.9-5.3 6.6-5.3s6.1 1.9 6.6 5.3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
              <input id="username" class="input" name="username" type="text" autocomplete="username" placeholder="请输入管理员账号" maxlength="60" required />
            </div>
          </div>

          <div class="field">
            <label class="field-label" for="password">登录密码</label>
            <div class="input-with-icon">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2.5" stroke="currentColor" stroke-width="1.7"/><path d="M8.4 10V7.8a3.6 3.6 0 1 1 7.2 0V10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
              <input id="password" class="input" name="password" type="password" autocomplete="current-password" placeholder="请输入登录密码" maxlength="200" required />
              <button id="toggle-password" class="input-action" type="button" aria-label="显示密码">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3.5 12S6.7 6.8 12 6.8 20.5 12 20.5 12 17.3 17.2 12 17.2 3.5 12 3.5 12Z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="2.8" stroke="currentColor" stroke-width="1.6"/></svg>
              </button>
            </div>
          </div>

          <p class="form-error" id="login-error" role="alert" hidden></p>
          <button class="button primary login-submit" id="login-submit" type="submit">
            <span>登录运营后台</span>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </form>

        <p class="login-help">首次启动时，服务端会自动创建默认管理员。账号信息见项目 README 与 <code>.env.example</code>，上线前请立即修改。</p>
        <footer class="login-footer">
          <span>© 2026 弦间</span>
          <span>自建分析 · 数据归你所有</span>
        </footer>
      </div>
    </section>
  </main>
</body>
</html>
